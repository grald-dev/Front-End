<!DOCTYPE html> 
<html>
    <Head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <Title>Login Page</Title>
        <link rel="stylesheet" href="../Css/LoginPage.css">
    </Head>

    <body>
        <section>
        <div class="login-box">
            <form action="HTML.html">
                <h2>Login</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="text" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <button class="icon password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                        <ion-icon name="eye-outline"></ion-icon>
                    </button>
                    <input id="password" type="password" required>
                    <label>Password</label>
                </div>
                <div class="remember-forget">
                    <label> <input type="checkbox">Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="btn" type="submit">Login</button>
            </form>
        </div>
        </section>

        <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
        <script>
            const passwordInput = document.getElementById("password");
            const passwordToggle = document.querySelector(".password-toggle");
            const passwordIcon = passwordToggle.querySelector("ion-icon");

            passwordToggle.addEventListener("click", () => {
                const isPasswordVisible = passwordInput.type === "text";

                passwordInput.type = isPasswordVisible ? "password" : "text";
                passwordIcon.name = isPasswordVisible ? "eye-outline" : "eye-off-outline";
                passwordToggle.setAttribute("aria-label", isPasswordVisible ? "Show password" : "Hide password");
                passwordToggle.setAttribute("aria-pressed", String(!isPasswordVisible));
            });
        </script>
    </body>
</html>
