<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing & Sales</title>
    <link rel="stylesheet" href="MarketingSales.css">
</head>
<body>

             <main class="main-content">
        <!-- Top Header Bar -->
        <div class="content-header">
            <div class="breadcrumb">
                <span>Marketing & Sales / Project Requests (REQ009 - REQ015)</span>
            </div>
            
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <a href="#" class="active">Project Requests</a>
            <a href="#">Quotation Builder</a>
            <a href="#">Sales Ledger</a>
            <a href="#">Saved Records</a>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            
            <!-- Action Toolbar -->
            <div class="toolbar">
                <button class="btn btn-primary"><i class='bx bx-plus'></i> New Client</button>
                <button class="btn btn-secondary"><i class='bx bx-plus'></i> New Project Request</button>
                <button class="btn btn-text"><i class='bx bx-save'></i> Save Project</button>
            </div>

            <!-- Client Information Form Section -->
            <div class="form-section">
                <h3 class="section-title">Client Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="client_id">Client ID</label>
                        <input type="text" id="client_id" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="company_name">Company Name</label>
                        <input type="text" id="company_name" class="form-control" placeholder="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="contact_person">Contact Person</label>
                        <input type="text" id="contact_person" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="email_address">Email Address</label>
                        <input type="email" id="email_address" class="form-control" placeholder="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telephone_no">Telephone No</label>
                        <input type="text" id="telephone_no" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <!-- Empty spacer for layout -->
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tin_number">TIN Number</label>
                        <input type="text" id="tin_number" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                         <!-- Empty spacer for layout -->
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="company_address">Company Address</label>
                        <textarea id="company_address" class="form-control"></textarea>
                    </div>
                </div>

            </div> <!-- End Client Information -->

            <!-- Project Request Details Section -->
            <div class="form-section">
                <h3 class="section-title">Project Request Details</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="project_name">Project Name</label>
                        <input type="text" id="project_name" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="subject_code">Subject Code</label>
                        <input type="text" id="subject_code" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="start_date">Start Date</label>
                        <input type="date" id="start_date" class="form-control" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="form-group">
                        <label for="target_end_date">Target End Date</label>
                        <input type="date" id="target_end_date" class="form-control" placeholder="dd/mm/yyyy">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Status</label>
                        <input type="text" id="status" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="dept_forwarding">Department Forwarding</label>
                        <input type="text" id="dept_forwarding" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="payment_confirmed">Payment Confirmed?</label>
                        <input type="text" id="payment_confirmed" class="form-control" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="account_exec">Account Exec</label>
                        <input type="text" id="account_exec" class="form-control" placeholder="">
                    </div>
                </div>

            </div> <!-- End Project Request Details -->

        </div>
    </main>
</body>
</html>
