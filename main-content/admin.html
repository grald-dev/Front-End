========================================== -->

<div id="equipmentSection" class="tab-content">

    <!-- Toolbar -->

            + Schedule Maintenance
        </button>

        <button class="btn">
            Mark Resolved
        </button>

        <button class="btn">
            💾 Save
        </button>

    </div>


    <!-- Equipment Maintenance Scheduling -->

        <!-- First Row -->
        <div class="form-row">

            <div class="form-group">
                <label>Equipment / Machine ID</label>
                <input
                    type="text"
                    class="form-control"
                >
            </div>

                <label>Equipment Name</label>
                <input
                    type="text"
                    class="form-control"

            </div>

                    type="date"

        <div class="form-row">

            <div class="form-group">
                <label>Assigned Technician</label>
                <input
                    type="text"
                    class="form-control"

            </div>

                <input
                    type="text"
                    class="form-control"
                >
            </div>

            <div class="form-group">

                <input
                    type="text"
                    class="form-control"
                >
            </div>

            <div class="form-group">

                <input
                    type="text"
                    class="form-control"

            </div>

        </div>

            <div class="form-group">

                <label>

                </label>

                <textarea

        </div>

</div>
