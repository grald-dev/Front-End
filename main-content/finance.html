<!-- ==========================
     AP, AR & BILLING
========================== -->

<div id="apArBillingSection" class="tab-content active-content">

    <!-- Accounts Payable / Receivable -->
<div class="form-section">

    <h3 class="section-title">
        Accounts Payable / Receivable
    </h3>

    <!-- Row 1 -->
    <div class="form-row">

        <div class="form-group">
            <label for="invoiceRecordId">
                Invoice/Record ID
            </label>
            <input
                type="text"
                id="invoiceRecordId"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="type">
                Type (AP/AR)
            </label>
            <input
                type="text"
                id="type"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="clientSupplierName">
                Client/Supplier Name
            </label>
            <input
                type="text"
                id="clientSupplierName"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="amount">
                Amount
            </label>
            <input
                type="number"
                id="amount"
                class="form-control"
            >
        </div>

    </div>


    <!-- Row 2 -->
    <div class="form-row">

        <div class="form-group">
            <label for="billingDate">
                Billing Date
            </label>

            <input
                type="date"
                id="billingDate"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="dueDate">
                Due Date
            </label>

            <input
                type="date"
                id="dueDate"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="paymentTerms">
                Payment Terms
            </label>

            <input
                type="text"
                id="paymentTerms"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="status">
                Status
            </label>

            <input
                type="text"
                id="status"
                class="form-control"
            >
        </div>

    </div>


    <!-- Billing Remarks -->
    <div class="form-row full">

        <div class="form-group">

            <label for="billingRemarks">
                Billing Remarks
            </label>

            <textarea
                id="billingRemarks"
                class="form-control"
                rows="4"
            ></textarea>

        </div>

    </div>

</div>

</div>
