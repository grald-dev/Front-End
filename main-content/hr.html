<!-- ==============================
     EMPLOYEE PROFILE
================================ -->

<div id="employeeProfileSection" class="tab-content active-content">

    <div class="form-section">

        <h2 class="section-title">
            Employee Profile & Statutory Info
        </h2>


        <!-- Row 1 -->
        <div class="form-row">

            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input
                    type="text"
                    id="employee_id"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input
                    type="text"
                    id="last_name"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="hire_date">Hire Date</label>
                <input
                    type="date"
                    id="hire_date"
                    class="form-control"
                >
            </div>

        </div>


        <!-- Row 2 -->
        <div class="form-row">

            <div class="form-group">
                <label for="position">Position</label>
                <input
                    type="text"
                    id="position"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input
                    type="text"
                    id="department"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="employment_type">Employment Type</label>
                <input
                    type="text"
                    id="employment_type"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="supervisor_id">Supervisor ID</label>
                <input
                    type="text"
                    id="supervisor_id"
                    class="form-control"
                >
            </div>

        </div>


        <!-- Row 3 -->
        <div class="form-row">

            <div class="form-group">
                <label for="salary">Salary</label>
                <input
                    type="number"
                    id="salary"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="tin_number">TIN Number</label>
                <input
                    type="text"
                    id="tin_number"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="sss_number">SSS Number</label>
                <input
                    type="text"
                    id="sss_number"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="pagibig_number">PAG-IBIG Number</label>
                <input
                    type="text"
                    id="pagibig_number"
                    class="form-control"
                >
            </div>

        </div>


        <!-- Row 4 -->
        <div class="form-row">

            <div class="form-group">
                <label for="emergency_contact">
                    Emergency Contact
                </label>

                <input
                    type="text"
                    id="emergency_contact"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="contact_number">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="contact_number"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="tax_status">
                    Tax Status
                </label>

                <input
                    type="text"
                    id="tax_status"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="account_status">
                    Account Status
                </label>

                <input
                    type="text"
                    id="account_status"
                    class="form-control"
                >
            </div>

        </div>


        <!-- Home Address -->
        <div class="form-row full">

            <div class="form-group">

                <label for="home_address">
                    Home Address
                </label>

                <textarea
                    id="home_address"
                    class="form-control"
                    rows="3"
                ></textarea>

            </div>

        </div>


        <!-- Benefits -->
        <div class="form-row full">

            <div class="form-group">

                <label for="benefits_adjustments">
                    Benefits & Compensation Adjustments
                </label>

                <textarea
                    id="benefits_adjustments"
                    class="form-control"
                    rows="3"
                ></textarea>

            </div>

        </div>

    </div>

</div>

        </div>

    </div>

</div>
